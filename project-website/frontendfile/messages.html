<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages — Campus Nexus</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .chat-layout { display:grid; grid-template-columns:300px 1fr; height:calc(100vh - 120px); background:var(--bg-card); border:1px solid var(--border); border-radius:var(--border-radius); overflow:hidden; }
        .convo-sidebar { border-right:1px solid var(--border); background:var(--bg-sidebar); display:flex; flex-direction:column; }
        .convo-search { padding:0.85rem; border-bottom:1px solid var(--border); }
        .convo-list { flex:1; overflow-y:auto; }
        .convo-item { display:flex; align-items:center; gap:0.75rem; padding:0.85rem 1rem; cursor:pointer; border-bottom:1px solid var(--border); transition:var(--transition); position:relative; }
        .convo-item:hover { background:rgba(255,255,255,0.04); }
        .convo-item.active { background:var(--primary-bg); border-left:3px solid var(--primary); }
        .chat-main { display:flex; flex-direction:column; background:var(--bg-page); }
        .chat-header { padding:0.85rem 1.25rem; border-bottom:1px solid var(--border); background:var(--bg-card); display:flex; align-items:center; justify-content:space-between; }
        .chat-stream { flex:1; padding:1.25rem; overflow-y:auto; display:flex; flex-direction:column; gap:0.75rem; }
        .chat-input-area { padding:0.85rem 1.25rem; border-top:1px solid var(--border); background:var(--bg-card); }
        @media (max-width:768px) { .chat-layout { grid-template-columns:1fr; } .convo-sidebar { display:none; } }
    </style>
</head>
<body>
    <nav class="navbar" id="main-nav"></nav>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-section-label">Main Menu</div>
            <ul class="sidebar-nav">
                <li><a href="/dashboard.html"><span class="nav-icon">📊</span>Overview</a></li>
                <li><a href="/projects.html"><span class="nav-icon">🔬</span>Projects</a></li>
                <li><a href="/applications.html"><span class="nav-icon">📋</span>Applications</a></li>
                <li><a href="/events.html"><span class="nav-icon">📅</span>Events</a></li>
                <li><a href="/messages.html" class="active"><span class="nav-icon">💬</span>Messages</a></li>

                <li><a href="/management.html"><span class="nav-icon">🏗️</span>Management</a></li>
                <li><a href="/profile.html"><span class="nav-icon">👤</span>Profile</a></li>
            </ul>
        </aside>

        <main class="dashboard-content" style="padding:1.5rem;">
            <div class="chat-layout animate-in">
                <!-- Conversations List Sidebar -->
                <div class="convo-sidebar">
                    <div class="convo-search">
                        <input type="text" id="contactSearchInput" class="form-control" placeholder="🔍 Search contacts & faculty..." style="font-size:0.8rem;padding:0.5rem 0.75rem;" oninput="filterContacts()">
                    </div>
                    <div class="convo-list" id="convoList">
                        <!-- Filled by JS -->
                    </div>
                </div>

                <!-- Chat Workspace -->
                <div class="chat-main">
                    <div class="chat-header" id="activeChatHeader">
                        <div style="display:flex;align-items:center;gap:0.75rem;">
                            <div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent-teal));display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:0.9rem;" id="activeChatAvatar">AT</div>
                            <div>
                                <div style="font-weight:700;font-size:0.95rem;color:var(--text-dark);" id="activeChatName">Prof. Aris Thorne</div>
                                <div style="font-size:0.75rem;color:var(--text-muted);display:flex;align-items:center;gap:0.35rem;" id="activeChatStatus">
                                    <span class="online-dot online"></span> Head of AI & Robotics · Online
                                </div>
                            </div>
                        </div>
                        <div style="display:flex;gap:0.5rem;">
                            <button class="btn btn-ghost btn-sm" title="Start Video Meeting" onclick="alert('Launching Campus Jitsi Video Conference...')">📹 Call</button>
                            <button class="btn btn-ghost btn-sm" title="Search Thread" onclick="alert('Searching conversation log...')">🔍</button>
                        </div>
                    </div>

                    <!-- Messages Stream -->
                    <div class="chat-stream" id="messageStream">
                        <!-- Filled by JS -->
                    </div>

                    <!-- Input Toolbar -->
                    <div class="chat-input-area">
                        <form id="messageForm" style="display:flex;gap:0.65rem;align-items:center;">
                            <button type="button" class="btn btn-ghost btn-sm" style="padding:0.4rem 0.6rem;font-size:1.1rem;" title="Attach File" onclick="alert('File Attachment: Select code snippet or PDF dossier to upload.')">📎</button>
                            <button type="button" class="btn btn-ghost btn-sm" style="padding:0.4rem 0.6rem;font-size:1.1rem;" title="Insert Emoji" onclick="alert('Emoji Keyboard: 👍 🚀 💻 🔬 🎓 🎯')">😄</button>
                            <input type="text" id="msgInput" class="form-control" placeholder="Type a message to team lead or mentor..." required style="font-size:0.875rem;">
                            <button type="submit" class="btn btn-primary" id="sendBtn">Send 🚀</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/utils.js"></script>
    <script>
    const CONTACTS = [
        { id: 101, name: "Prof. Aris Thorne", title: "Head of AI & Robotics", status: "online", avatar: "AT", unread: 1 },
        { id: 2, name: "Rohan Mehta", title: "AI/ML 3rd Year · Roll 23AI0841", status: "online", avatar: "RM", unread: 0 },
        { id: 103, name: "Dr. Rajesh Kumar", title: "Prof of Cryptography", status: "online", avatar: "RK", unread: 0 },
        { id: 3, name: "Priya Patel", title: "Cyber Security 4th Year · Roll 22CY0415", status: "away", avatar: "PP", unread: 0 },
        { id: 102, name: "Dr. Meera Reddy", title: "Director, Quantum Lab", status: "away", avatar: "MR", unread: 0 },
        { id: 4, name: "Marcus Vance", title: "Data Science 2nd Year · Roll 24DS0112", status: "offline", avatar: "MV", unread: 0 },
        { id: 5, name: "Aisha Khan", title: "BioTech 3rd Year · Roll 23BT0509", status: "offline", avatar: "AK", unread: 0 }
    ];

    const SAMPLE_CHATS = {
        101: [
            { sender_id: 101, sender_name: "Prof. Aris Thorne", content: "Hi Niyati! I reviewed your Smart Grid Micro-Grid architecture diagram. Excellent work.", created_at: "09:30 AM" },
            { sender_id: 101, sender_name: "Prof. Aris Thorne", content: "Let's discuss adding automated anomaly detection during office hours tomorrow at 2 PM.", created_at: "09:31 AM" },
            { sender_id: 1, sender_name: "Niyati Goplani", content: "Thank you Prof. Thorne! That sounds great. I'll prepare the telemetry data logs for our meeting.", created_at: "09:42 AM" }
        ],
        2: [
            { sender_id: 2, sender_name: "Rohan Mehta", content: "Hey Niyati, I submitted an application for your Smart Grid project!", created_at: "10:15 AM" },
            { sender_id: 2, sender_name: "Rohan Mehta", content: "Would love to hook up my solar predictive neural net to your MQTT broker.", created_at: "10:16 AM" },
            { sender_id: 1, sender_name: "Niyati Goplani", content: "Awesome Rohan! Just saw your note. Your PyTorch models for solar forecasting are a perfect fit. I'm accepting your application now!", created_at: "10:28 AM" }
        ],
        103: [
            { sender_id: 103, sender_name: "Dr. Rajesh Kumar", content: "Niyati, welcome to the Quantum Security research group. Please review NIST Kyber specification.", created_at: "Yesterday" }
        ],
        3: [
            { sender_id: 3, sender_name: "Priya Patel", content: "Niyati, are you attending Dr. Kumar's Quantum Cryptography summit next week?", created_at: "11:05 AM" },
            { sender_id: 1, sender_name: "Niyati Goplani", content: "Definitely Priya! Let's draft the abstract this weekend.", created_at: "11:20 AM" }
        ],
        102: [
            { sender_id: 102, sender_name: "Dr. Meera Reddy", content: "Great progress on the quantum simulation benchmarks!", created_at: "Aug 6" }
        ],
        4: [
            { sender_id: 4, sender_name: "Marcus Vance", content: "Hi Niyati, the React dashboard telemetry components are ready on GitHub!", created_at: "02:10 PM" }
        ],
        5: [
            { sender_id: 5, sender_name: "Aisha Khan", content: "Hi Niyati! Looking forward to collaborating on the EMG myoelectric signals module.", created_at: "Aug 7" }
        ]
    };

    let activeContactId = 101, currentUser = null;

    function filterContacts() {
        const q = (document.getElementById('contactSearchInput').value || '').toLowerCase();
        renderContacts(CONTACTS.filter(c => c.name.toLowerCase().includes(q) || c.title.toLowerCase().includes(q)));
    }

    function renderContacts(list) {
        const c = document.getElementById('convoList');
        c.innerHTML = list.map(item => `
            <div class="convo-item ${item.id === activeContactId ? 'active' : ''}" onclick="selectContact(${item.id})">
                <div style="position:relative;">
                    <div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent-teal));display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:0.82rem;">${item.avatar}</div>
                    <span class="online-dot ${item.status}" style="position:absolute;bottom:0;right:0;border:2px solid var(--bg-card);"></span>
                </div>
                <div style="flex:1;overflow:hidden;">
                    <div style="font-weight:700;font-size:0.85rem;color:var(--text-dark);display:flex;justify-content:space-between;align-items:center;">
                        <span>${item.name}</span>
                        ${item.unread ? `<span class="badge badge-rose" style="font-size:0.65rem;padding:0.1rem 0.4rem;">${item.unread}</span>` : ''}
                    </div>
                    <div style="font-size:0.75rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:0.15rem;">${item.title}</div>
                </div>
            </div>
        `).join('');
    }

    function selectContact(id) {
        activeContactId = id;
        const contact = CONTACTS.find(c => c.id === id) || CONTACTS[0];
        contact.unread = 0;
        
        renderContacts(CONTACTS);

        document.getElementById('activeChatName').textContent = contact.name;
        document.getElementById('activeChatAvatar').textContent = contact.avatar;
        document.getElementById('activeChatStatus').innerHTML = `<span class="online-dot ${contact.status}"></span> ${contact.title} · ${contact.status.toUpperCase()}`;

        renderMessages();
    }

    function renderMessages() {
        const stream = document.getElementById('messageStream');
        const msgs = SAMPLE_CHATS[activeContactId] || [];

        if (!msgs.length) {
            stream.innerHTML = `<div class="empty-state"><div class="emoji">💬</div><h3>No messages yet</h3><p>Send a message to start the conversation.</p></div>`;
            return;
        }

        stream.innerHTML = msgs.map(m => {
            const isMe = m.sender_id === 1 || (currentUser && m.sender_id === currentUser.id);
            return `
                <div class="message-bubble ${isMe ? 'sent' : 'received'}">
                    <div style="font-size:0.72rem;color:var(--text-muted);margin-bottom:0.25rem;font-weight:600;">${isMe ? 'You' : m.sender_name}</div>
                    <div class="bubble-content">${m.content}</div>
                    <div class="bubble-meta">${m.created_at || 'Just now'}</div>
                </div>
            `;
        }).join('');

        stream.scrollTop = stream.scrollHeight;
    }

    document.addEventListener('DOMContentLoaded', async () => {
        currentUser = await checkAuth();
        if (!currentUser) return;

        // Query string navigation handler
        const params = new URLSearchParams(window.location.search);
        const toId = parseInt(params.get('to'));
        if (toId && CONTACTS.some(c => c.id === toId)) {
            activeContactId = toId;
        }

        renderContacts(CONTACTS);
        selectContact(activeContactId);

        document.getElementById('messageForm').addEventListener('submit', async e => {
            e.preventDefault();
            const input = document.getElementById('msgInput');
            const content = input.value.trim();
            if (!content) return;

            try {
                await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ receiver_id: activeContactId, message: content })
                });
            } catch(e){}

            if (!SAMPLE_CHATS[activeContactId]) SAMPLE_CHATS[activeContactId] = [];
            SAMPLE_CHATS[activeContactId].push({
                sender_id: currentUser.id,
                sender_name: currentUser.name || 'Niyati Goplani',
                content,
                created_at: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });

            input.value = '';
            renderMessages();
        });
    });
    </script>
</body>
</html>
